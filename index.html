<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Rozliczenia</title>
  <meta name="description" content="Rozliczenia z szefem i praca Pati u Svena">
  <meta name="theme-color" content="#1b5e3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rozliczenia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Rozliczenia</h1>
  </header>

  <main id="view"></main>

  <button id="fab" class="fab" aria-label="Dodaj">+</button>

  <nav class="tabbar">
    <button class="tab active" data-tab="kasa">
      <span class="tab-icon">💶</span><span>Kasa</span>
    </button>
    <button class="tab" data-tab="wyplata">
      <span class="tab-icon">💰</span><span>Wypłata</span>
    </button>
    <button class="tab" data-tab="pati">
      <span class="tab-icon">👩‍🔧</span><span>Pati</span>
    </button>
    <button class="tab" data-tab="wiecej">
      <span class="tab-icon">⋯</span><span>Więcej</span>
    </button>
  </nav>

  <!-- Formularz: ruch kasy (dostałem / wydałem) -->
  <dialog id="dlg-ruch">
    <form method="dialog" id="form-ruch">
      <h2 id="dlg-ruch-title">Nowy wpis</h2>
      <input type="hidden" name="id">
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="kind" value="in"><span>Szef dał mi</span></label>
        <label><input type="radio" name="kind" value="out" checked><span>Wydałem</span></label>
      </div>
      <div class="field only-in" id="cel-field">
        <span>Co to jest?</span>
        <div class="seg cats" role="radiogroup">
          <label><input type="radio" name="cel" value="wydatki" checked><span>Na wydatki</span></label>
          <label><input type="radio" name="cel" value="wyplata"><span>Moja wypłata</span></label>
          <label><input type="radio" name="cel" value="pati"><span>Dla Pati</span></label>
        </div>
        <p class="field-hint" id="cel-hint"></p>
      </div>
      <label class="field">
        <span>Data</span>
        <input type="date" name="date" required>
      </label>
      <div class="row">
        <label class="field grow">
          <span>Kwota</span>
          <input type="number" name="amount" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
        </label>
        <label class="field">
          <span>Waluta</span>
          <select name="currency">
            <option value="EUR">€</option>
            <option value="PLN">zł</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span id="note-label">Opis</span>
        <input type="text" name="note" placeholder="np. paliwo, materiały…" autocomplete="off">
      </label>
      <label class="check only-out">
        <input type="checkbox" name="poza">
        <span>Zapłaciłem ze swojego <small>(nie odejmuje od kasy szefa)</small></span>
      </label>
      <div class="actions">
        <button type="button" class="btn danger" id="btn-ruch-delete" hidden>Usuń</button>
        <span class="grow"></span>
        <button type="button" class="btn" data-close>Anuluj</button>
        <button type="submit" class="btn primary">Zapisz</button>
      </div>
    </form>
  </dialog>

  <!-- Formularz: Pati – dzień pracy -->
  <dialog id="dlg-praca">
    <form method="dialog" id="form-praca">
      <h2 id="dlg-praca-title">Praca u Svena</h2>
      <input type="hidden" name="id">
      <label class="field">
        <span>Data</span>
        <input type="date" name="date" required>
      </label>
      <label class="field">
        <span>Zarobione (€)</span>
        <input type="number" name="amount" inputmode="decimal" step="0.01" min="0" placeholder="100" required>
      </label>
      <label class="field">
        <span>Uwagi</span>
        <input type="text" name="note" placeholder="opcjonalnie" autocomplete="off">
      </label>
      <div class="actions">
        <button type="button" class="btn danger" id="btn-praca-delete" hidden>Usuń</button>
        <span class="grow"></span>
        <button type="button" class="btn" data-close>Anuluj</button>
        <button type="submit" class="btn primary">Zapisz</button>
      </div>
    </form>
  </dialog>

  <!-- Wybór: co dodać w zakładce Kasa -->
  <dialog id="dlg-kasa-wybor">
    <form method="dialog" class="menu-form">
      <h2>Co chcesz wpisać?</h2>
      <button type="button" class="btn block" data-kasa-add="in"><span>Szef dał mi kasę</span><span>💶</span></button>
      <button type="button" class="btn block" data-kasa-add="out"><span>Wydałem na coś</span><span>🧾</span></button>
      <p class="hint">Jak szef daje kasę — od razu mówisz, czy to na wydatki, Twoja wypłata, czy dla Pati.</p>
      <div class="actions">
        <span class="grow"></span>
        <button type="button" class="btn" data-close>Anuluj</button>
      </div>
    </form>
  </dialog>

  <!-- Wybór: co dodać w zakładce Pati -->
  <dialog id="dlg-pati-wybor">
    <form method="dialog" class="menu-form">
      <h2>Co dodać?</h2>
      <button type="button" class="btn block" data-pati-add="praca"><span>Dzień pracy u Svena</span><span>🛠️</span></button>
      <button type="button" class="btn block" data-pati-add="wyplata"><span>Pati dostała kasę</span><span>💶</span></button>
      <div class="actions">
        <span class="grow"></span>
        <button type="button" class="btn" data-close>Anuluj</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file-import" accept="application/json,.json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js?v=9"></script>
</body>
</html>
